name: Eval Quality Gate

on: 
  pull_request:
    paths:
      - 'eval_service/src/**'
      - 'eval_service/benchmarks/**'
      - 'backend/src/**'

jobs:
  eval-gate:
    name: Run Eval benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start infrastructure (Clickhouse + Redis)
        run: |
          docker compose -f backend/docker-compose.yml up -d redis clickhouse
          echo "Waiting for clickhouse to be ready.."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8123/ping; then break; fi
            sleep 2 
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          
      - name: Start gateway (backend)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERNAL_API_KEY: secret-internal-key-123
          REDIS_URL: redis://localhost:6379/0
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PASSWORD: gateway_secure_123
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          echo "Waiting for gateway to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/health; then
              echo "Gateway ready after ${i} attempts"
              break
            fi
            echo "  attempt $i/30 — not ready yet, waiting 2s..."
            sleep 2
          done
          curl -sf http://localhost:8000/api/v1/health || (echo "Gateway not ready after 60s"; exit 1)
        working-directory: backend
      
      - name: Install eval_service dependencies
        run: |
          pip install -r eval_service/requirements.txt
      - name: Start eval_service
        env:
          GATEWAY_URL: http://localhost:8000
          INTERNAL_API_KEY: secret-internal-key-123
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PASSWORD: gateway_secure_123
          JUDGE_MODEL: gemini-2.5-flash
          JUDGE_PROVIDER: google
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          uvicorn src.main:app --host 0.0.0.0 --port 8001 &
          echo "Waiting for eval_service to be ready..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health; then
              echo "Eval service ready after ${i} attempts"
              break
            fi
            echo "  attempt $i/30 — not ready yet, waiting 2s..."
            sleep 2
          done
          curl -sf http://localhost:8001/health || (echo "Eval service not ready after 60s"; exit 1)
        working-directory: eval_service
      
      - name: Run benchmark regression gate
        env:
          EVAL_SERVICE_URL: http://localhost:8001
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PASSWORD: gateway_secure_123
          BENCHMARK_MODELS: "google:gemini-2.5-flash,google:gemini-2.0-flash"
          BENCHMARK_LIMIT: "15"
          REGRESSION_THRESHOLD: "0.3"
        run: |
          python eval_service/scripts/run_benchmark.py